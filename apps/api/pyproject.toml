[project]
name = "twinpm"
version = "0.1.0"
description = "TwinPM API: AI digital twin for technical program and product managers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.12.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.4.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "langchain-anthropic==1.7.12",
    "langchain-core==1.8.4",
    "langchain-mcp-adapters==0.3.2",
    "langgraph==1.2.24",
    "langgraph-checkpoint-postgres==3.2.1",
    "mcp>=1.30.0",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pandas>=3.1.1",
    "pgvector>=0.5.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "redis>=5.3.1",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "sse-starlette>=3.7.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twinpm"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "testcontainers>=4.15.0",
    "types-networkx>=3.6.1.20261119",
]

[project.optional-dependencies]
# Local transformer embeddings (all-MiniLM-L6-v2). Without this extra, TwinPM uses a
# deterministic hashing embedder so the demo runs fully offline. See docs/adr/0003.
embeddings = ["sentence-transformers>=3.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "C4", "PT"]
ignore = ["S101", "B008", "RUF012", "S311"]

[tool.ruff.lint.per-file-ignores]
"twinpm/tests/**" = ["S105", "S106", "S108", "N802"]
"twinpm/seed/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["shap.*", "xgboost.*", "sklearn.*", "joblib.*", "arq.*", "sentence_transformers.*", "pgvector.*", "testcontainers.*", "respx.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["twinpm/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["twinpm"]
omit = ["twinpm/tests/*", "twinpm/seed/*"]
