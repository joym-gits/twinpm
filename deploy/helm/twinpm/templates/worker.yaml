apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinpm-worker
  labels: {{- include "twinpm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector: { matchLabels: { app: twinpm-worker } }
  template:
    metadata: { labels: { app: twinpm-worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: worker
          image: {{ .Values.image.api }}
          command: ["arq", "twinpm.workers.settings.WorkerSettings"]
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          env: {{- include "twinpm.env" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          livenessProbe:
            exec: { command: ["arq", "--check", "twinpm.workers.settings.WorkerSettings"] }
            periodSeconds: 60
          volumeMounts: [{ name: models, mountPath: /app/models }]
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: twinpm-models }
