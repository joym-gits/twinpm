apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: twinpm-models }
spec:
  accessModes: ["ReadWriteMany"]
  resources: { requests: { storage: {{ .Values.modelsVolume.size }} } }
  {{- if .Values.modelsVolume.storageClass }}
  storageClassName: {{ .Values.modelsVolume.storageClass }}
  {{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twinpm
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"   # SSE streams
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls }}
  tls: [{ hosts: [{{ .Values.ingress.host }}], secretName: twinpm-tls }]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - { path: /mcp, pathType: Prefix, backend: { service: { name: twinpm-api, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: twinpm-web, port: { number: 3000 } } } }
{{- end }}
