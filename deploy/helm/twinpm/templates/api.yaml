apiVersion: apps/v1
kind: Deployment
metadata:
  name: twinpm-api
  labels: {{- include "twinpm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector: { matchLabels: { app: twinpm-api } }
  template:
    metadata:
      labels: { app: twinpm-api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      initContainers:
        - name: migrate
          image: {{ .Values.image.api }}
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          env: {{- include "twinpm.env" . | nindent 12 }}
      containers:
        - name: api
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "twinpm.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports: [{ containerPort: 8000, name: http }]
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          env: {{- include "twinpm.env" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: ["ALL"] } }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /healthz, port: http }, failureThreshold: 30, periodSeconds: 5 }
          volumeMounts: [{ name: models, mountPath: /app/models }]
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: twinpm-models }
---
apiVersion: v1
kind: Service
metadata: { name: twinpm-api }
spec:
  selector: { app: twinpm-api }
  ports: [{ port: 8000, targetPort: http, name: http }]
